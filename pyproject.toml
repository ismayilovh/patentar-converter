[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "patentar-model-api"
version = "0.1.0"
description = "Read-only model catalog and stable GLB resolver for 3DPatentAR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
patentar-api = "patentar_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["api/patentar_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=patentar_api --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api"]
extend-exclude = ["Converter", "SampleModels"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
