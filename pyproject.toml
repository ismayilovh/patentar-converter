[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "patentar-converter"
version = "0.1.0"
description = "Convert supported CAD and mesh formats into validated GLB files"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.scripts]
patentar-convert = "patentar_converter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patentar_converter"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=patentar_converter --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
