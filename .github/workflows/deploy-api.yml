name: Deploy API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-model-api
  cancel-in-progress: false

env:
  SERVICE_NAME: patentar-model-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in PROJECT_ID REGION REPOSITORY PROVIDER SERVICE_ACCOUNT SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository variable: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push API image
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/patentar-model-api:${{ github.sha }}
        run: |
          docker build --file api/Dockerfile --tag "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/patentar-model-api:${{ github.sha }}
          env_vars_update_strategy: overwrite
          env_vars: |-
            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
            PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            SUPABASE_TIMEOUT_SECONDS=10
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --concurrency=80
            --min-instances=0
            --max-instances=5

      - name: Verify deployment
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --show-error --silent "${SERVICE_URL}/health/live"
          curl --fail --show-error --silent "${SERVICE_URL}/health/ready"
          curl --fail --show-error --silent "${SERVICE_URL}/v1/models"
